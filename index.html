<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenji Shimizu | Developer & Creative</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4HK8RPGPLX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4HK8RPGPLX'); // Replace with your GA4 Measurement ID
    </script>

    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/30095254?v=4">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Comforter+Brush&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- BaguetteBox for Gallery -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/baguettebox.js/1.8.1/baguetteBox.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    
    

</head>

<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loader">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </div>

    <!-- Main Slider Container -->
    <main class="split-container" id="split-container">

        <!-- Developer Side (Base/Left/Top) -->
        <section class="side developer-side" id="developer-side">

            <!-- Hero Section -->
            <div class="hero dev-hero">
                <div class="hero-content">
                    <h1 class="glitch-text" data-text="DEVELOPER">DEVELOPER</h1>
                    <p class="subtitle code-font">&lt;Building The Future /&gt;</p>
                </div>
                <!-- Interactive Canvas -->
                <canvas id="canvas-dev" class="hero-canvas"></canvas>
                <div class="scroll-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="content-wrapper">
                <div class="scroll-content" id="developer-content">
                    <!-- Dynamic Content Loaded Here -->
                </div>
            </div>
        </section>

        <!-- Creative Side (Overlay/Right/Bottom) -->
        <section class="side creative-side" id="creative-side">

            <!-- Mask Wrapper to prevent reflow -->
            <div class="mask-wrapper">
                <!-- Hero Section -->
                <div class="hero creative-hero">
                    <div class="hero-content">
                        <h1 class="brush-text">Creative</h1>
                        <p class="subtitle">Art is Chaos taking Shape</p>

                        <!-- 3D EXHIBITION CALL TO ACTION (Moved into Hero for mobile visibility) -->
                        <div style="margin-top: 2rem;">
                            <a href="gallery-3d.html" style="
                                display: inline-flex;
                                align-items: center;
                                gap: 12px;
                                background: linear-gradient(135deg, var(--creative-accent) 0%, var(--creative-secondary) 100%);
                                padding: 12px 28px;
                                border-radius: 50px;
                                color: #fff;
                                text-decoration: none;
                                font-weight: 800;
                                font-size: 0.85rem;
                                letter-spacing: 1px;
                                box-shadow: 0 8px 25px rgba(255, 0, 85, 0.3);
                                transition: all 0.3s ease;
                                pointer-events: auto;
                            ">
                                <span class="material-icons">view_in_ar</span>
                                <span>EXPLORE 3D EXHIBITION</span>
                            </a>
                            <a href="analytics.html" style="margin-top: 1rem; display: block; color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.7rem; font-family: var(--dev-font); letter-spacing: 1px;">
                                VIEW SITE ANALYTICS &rarr;
                            </a>
                        </div>
                    </div>
                    <!-- Interactive Canvas -->
                    <canvas id="canvas-creative" class="hero-canvas"></canvas>
                    <div class="scroll-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>

                <div class="content-wrapper">
                    <div class="scroll-content" id="creative-content">
                        <!-- Dynamic Content Loaded Here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Slider Handle -->
        <div class="handle" id="slider-handle">
            <div class="handle-line"></div>
            <div class="handle-circle">
                <span class="arrow left">&larr;</span>
                <span class="arrow right">&rarr;</span>
                <span class="arrow up">&uarr;</span>
                <span class="arrow down">&darr;</span>
            </div>
        </div>

    </main>

    <!-- Floating Effect Interactive Canvas -->
    <canvas id="canvas-floating"></canvas>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/baguettebox.js/1.8.1/baguetteBox.min.js"></script>
    <script src="assets/js/loader.js" type="module"></script>
    <script src="assets/js/app.js" type="module"></script>
</body>

</html>
